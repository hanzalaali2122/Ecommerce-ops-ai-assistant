<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ecommerce Ops Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark">◎</span>
        <div class="brand-text">
          <strong>Ops Assistant</strong>
          <span>Ecommerce intelligence</span>
        </div>
      </div>

      <nav class="nav">
        <button class="tab-btn active" data-tab="chat">
          <svg viewBox="0 0 24 24" fill="none"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>Chat assistant</span>
        </button>
        <button class="tab-btn" data-tab="investigation">
          <svg viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.6"/><path d="m21 21-4.35-4.35" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          <span>Investigation view</span>
        </button>
        <button class="tab-btn" data-tab="approvals">
          <svg viewBox="0 0 24 24" fill="none"><path d="M9 12.5 11 14.5 15.5 10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="3.5" y="4" width="17" height="17" rx="3" stroke="currentColor" stroke-width="1.6"/></svg>
          <span>Approval inbox</span>
          <span class="nav-badge" id="pendingBadge" hidden>0</span>
        </button>
      </nav>

      <div class="sidebar-foot">
        <div class="field">
          <label for="role">Role</label>
          <select id="role">
            <option value="analyst">analyst</option>
            <option value="support">support</option>
            <option value="manager">manager</option>
          </select>
        </div>
        <div class="field">
          <label for="userId">User id</label>
          <input id="userId" value="demo-user" />
        </div>
        <div id="healthBadge" class="health-badge">checking…</div>
      </div>
    </aside>

    <!-- Main -->
    <div class="main-area">
      <header class="topbar">
        <div>
          <h1 id="pageTitle">Chat assistant</h1>
          <p id="pageSubtitle" class="subtitle">Ask a business question in plain English — every answer is backed by real tool calls, never guessed.</p>
        </div>
        <code class="api-pill" id="apiBaseLabel"></code>
      </header>

      <main>
        <!-- Chat assistant -->
        <section id="tab-chat" class="tab-panel active">
          <div class="examples-grid" id="examplesGrid"></div>

          <form id="chatForm" class="chat-form">
            <textarea id="question" placeholder="Ask a business question in plain English…" rows="3"></textarea>
            <button type="submit" class="btn-primary">
              <span>Ask</span>
              <svg viewBox="0 0 24 24" fill="none"><path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </form>

          <div id="chatResult" class="result"></div>
        </section>

        <!-- Investigation view -->
        <section id="tab-investigation" class="tab-panel">
          <form id="investigationForm" class="inline-form">
            <input id="requestId" placeholder="request_id (auto-filled after a chat question)" />
            <button type="submit" class="btn-secondary">Load tool runs</button>
          </form>
          <div id="investigationResult" class="result"></div>
        </section>

        <!-- Approval inbox -->
        <section id="tab-approvals" class="tab-panel">
          <div class="approvals-toolbar">
            <div class="field inline">
              <label for="approvalStatus">Filter</label>
              <select id="approvalStatus">
                <option value="">all</option>
                <option value="pending">pending</option>
                <option value="approved">approved</option>
                <option value="rejected">rejected</option>
                <option value="executed">executed</option>
              </select>
            </div>
            <button id="refreshApprovals" class="btn-secondary">Refresh</button>
          </div>
          <div id="approvalsResult" class="result"></div>
        </section>
      </main>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
